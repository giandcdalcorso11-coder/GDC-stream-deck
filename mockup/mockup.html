<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><title>Mockup pannello</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;height:100vh;overflow:hidden;font-family:system-ui,sans-serif}
#stage{width:1024px;height:768px;transform-origin:0 0;position:absolute;left:0;top:0}
/* ---------- temi ---------- */
.t-windows{--bg:#1b1b1d;--card:#262629;--key:#2f2f33;--text:#f3f3f3;--muted:#9a9aa2;--accent:#0078d4;--sys:#0078d4;--audio:#4cc2ff;--work:#8e8cd8;--danger:#e5484d;--r:6px;--glow:none;--font:"Segoe UI",system-ui,sans-serif;--tr:.5}
.t-apple{--bg:radial-gradient(circle at 15% 20%,#ff7a59 0,transparent 38%),radial-gradient(circle at 85% 15%,#7a5cff 0,transparent 40%),radial-gradient(circle at 70% 85%,#00c2ff 0,transparent 42%),radial-gradient(circle at 10% 90%,#ff3d9a 0,transparent 35%),#1a1033;--card:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.07));--key:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08));--text:#fff;--muted:rgba(255,255,255,.7);--accent:#fff;--sys:#9fd3ff;--audio:#8cffb0;--work:#e0b3ff;--danger:#ff9c9c;--r:28px;--font:-apple-system,"SF Pro Display",system-ui,sans-serif}
.t-neon{--bg:#07071a;--card:#0d0d2b;--key:#0d0d2b;--text:#e8f9ff;--muted:#6b7bb0;--accent:#00f0ff;--sys:#00f0ff;--audio:#ff2bd6;--work:#ffe14d;--danger:#ff3b6b;--r:12px;--glow:1;--font:"Trebuchet MS",system-ui,sans-serif;--tr:.8}
.t-dj{--bg:repeating-linear-gradient(90deg,#101113 0 2px,#131416 2px 4px);--card:linear-gradient(#202124,#17181a);--key:linear-gradient(#2a2b2f,#18191b);--text:#e6e8ec;--muted:#8d9098;--accent:#ff9d00;--sys:#2f9bff;--audio:#2fe06a;--work:#ff9d00;--danger:#ff3b30;--r:3px;--font:"Arial Narrow",Arial,sans-serif}
#stage{background:var(--bg);color:var(--text);font-family:var(--font);padding:14px;display:grid;gap:12px;grid-template-rows:176px 230px 1fr;grid-template-columns:1fr 1fr}
.card{background:var(--card);border-radius:var(--r);padding:14px 18px;position:relative;min-height:0}
.t-neon .card,.t-neon .key{border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 25%,transparent) inset,0 0 10px color-mix(in srgb,var(--accent) 20%,transparent)}
/* orologio */
#clock{font-size:64px;font-weight:300;line-height:1}
#clock small{font-size:24px;color:var(--muted);margin-left:8px}
#date{color:var(--muted);margin-top:6px;font-size:18px}
.stat{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin-top:8px}
.bar{flex:1;height:8px;background:var(--key);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.t-neon .bar i{box-shadow:0 0 8px var(--accent)}
/* musica */
#now{display:flex;align-items:center;gap:16px}
#art{width:84px;height:84px;border-radius:calc(var(--r) - 2px);background:linear-gradient(135deg,var(--accent),var(--audio));display:flex;align-items:center;justify-content:center}
#song{font-size:24px;font-weight:600}#artist{color:var(--muted);margin-top:2px}
#tr{display:flex;gap:12px;margin-top:14px;justify-content:center}
.tb{width:54px;height:44px;border-radius:calc(var(--r) - 2px);background:var(--key);display:flex;align-items:center;justify-content:center;color:var(--text);border:0}
.tb.big{width:78px;background:var(--accent);color:#000}
svg.i{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* volume */
#vol{grid-column:1/span 2;display:flex;gap:18px;align-items:center}
#master{flex:0 0 380px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#apps{flex:1;display:flex;gap:14px;justify-content:space-around;align-items:center;border-left:1px solid var(--key);padding-left:18px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;width:150px}
.lbl{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}.lbl b{color:var(--text);font-weight:600}
.big-title{font-size:15px;color:var(--muted)}
/* slider */
.sl{position:relative;touch-action:none;cursor:pointer;width:100%}
.sl .tk{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);background:var(--key)}
.sl .fl{position:absolute;left:0;top:50%;transform:translateY(-50%);background:var(--accent)}
.sl .th{position:absolute;top:50%;transform:translate(-50%,-50%);background:var(--text)}
.sl.lg{height:54px}.sl.sm{height:34px}
.t-windows .sl .tk,.t-windows .sl .fl{height:4px;border-radius:2px}.t-windows .sl.lg .tk,.t-windows .sl.lg .fl{height:6px}
.t-windows .sl .th{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid #fff}.t-windows .sl.lg .th{width:24px;height:24px}
/* knob */
.kn{touch-action:none;cursor:ns-resize;display:block}
.kn text{fill:var(--text);font-family:var(--font);text-anchor:middle}
/* pulsanti */
#deck{grid-column:1/span 2;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:12px}
#bar{grid-column:1/span 2;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:-4px}
.key{border:0;background:var(--key);color:var(--text);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:16px;cursor:pointer;transition:transform .1s}
.key:active{transform:scale(.95)}
.key svg.i{width:44px;height:44px;stroke-width:1.6}
.key[data-c=sys] svg{color:var(--sys)}.key[data-c=audio] svg{color:var(--audio)}.key[data-c=work] svg{color:var(--work)}.key[data-c=danger] svg{color:var(--danger)}
.t-apple .key{background:var(--key)}
.t-neon .key svg{filter:drop-shadow(0 0 6px currentColor)}

/* ---- Apple: liquid glass ---- */
.t-apple .card,.t-apple .key,.t-apple .tb,.t-apple #sw{-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(255,255,255,.12),inset 0 0 22px rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.30)}
.t-apple .tb.big{background:rgba(255,255,255,.85);color:#111}
.t-apple .bar{background:rgba(255,255,255,.18)}.t-apple .bar i{background:#fff}
.t-apple #art{background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(255,255,255,.2));color:#111}
.t-apple .key{font-weight:500}
/* ---- DJ: console hardware ---- */
.t-dj{text-transform:uppercase;letter-spacing:.06em}
.t-dj .card{border:1px solid #000;box-shadow:inset 0 1px 0 #3b3d43,0 2px 0 #000}
.t-dj #c1,.t-dj #c2{background:#05080f;border:1px solid #1c3b6b;box-shadow:inset 0 0 30px rgba(47,155,255,.12);overflow:hidden}
.t-dj #clock{font-weight:400;color:#7cc4ff;font-family:"Courier New",monospace;font-size:62px}
.t-dj #date,.t-dj .stat{color:#4f86bd}.t-dj .bar{background:#0b1a30}.t-dj .bar i{background:#2f9bff}
.t-dj #song{color:#7cc4ff;font-size:22px}.t-dj #artist{color:#4f86bd}
.t-dj #c2>*{position:relative;z-index:1}.t-dj .wave{position:absolute;left:0;right:0;bottom:0;height:70px;opacity:.5;z-index:0}
.t-dj .tb{background:linear-gradient(#2a2b2f,#18191b);border:1px solid #000;box-shadow:inset 0 1px 0 #44464c}
.t-dj .tb.big{background:linear-gradient(#ffb23a,#e08400);color:#000}
.t-dj #art{border-radius:2px;background:linear-gradient(135deg,#2f9bff,#0b3a6b);color:#fff}
.t-dj .lbl{color:#9a9da6;font-size:11px}.t-dj .lbl b{color:#ff9d00}
.t-dj .key{text-transform:uppercase;position:relative;flex-direction:column-reverse;justify-content:center;border:1px solid #000;box-shadow:inset 0 1px 0 #4a4c53,0 2px 0 #000;font-size:12px;color:#aeb2bb;gap:12px}
.t-dj .key svg.i{color:#d8dbe2!important;width:38px;height:38px}
.t-dj .key::after{content:"";position:absolute;left:18%;right:18%;bottom:9px;height:5px;border-radius:2px;background:var(--led,#ff9d00);box-shadow:0 0 10px var(--led,#ff9d00)}
.t-dj .key[data-c=sys]{--led:#2f9bff}.t-dj .key[data-c=audio]{--led:#2fe06a}.t-dj .key[data-c=work]{--led:#ff9d00}.t-dj .key[data-c=danger]{--led:#ff3b30}
.t-dj #master{flex:0 0 330px;flex-direction:row;gap:22px}
.fd{position:relative;width:76px;height:150px;touch-action:none;cursor:pointer;margin:0 auto}
.fd.sm{width:56px;height:118px}
.fd .scale{position:absolute;left:0;right:0;top:8px;bottom:8px;background:repeating-linear-gradient(180deg,#8d9098 0 1px,transparent 1px 10%)}
.fd .slot{position:absolute;left:50%;top:8px;bottom:8px;width:8px;margin-left:-4px;background:#000;border-radius:4px;box-shadow:0 0 0 1px #2c2d31}
.fd .cap{position:absolute;left:50%;width:46px;height:28px;margin-left:-23px;background:linear-gradient(#6a6c74,#2b2c30 45%,#55575e);border:1px solid #000;border-radius:3px;box-shadow:0 3px 4px rgba(0,0,0,.6),inset 0 1px 0 #8a8c94}
.fd.sm .cap{width:34px;height:22px;margin-left:-17px}
.fd .cap::after{content:"";position:absolute;left:50%;top:3px;bottom:3px;width:3px;margin-left:-1.5px;background:#fff}
.vu{display:flex;flex-direction:column-reverse;gap:3px;height:150px;justify-content:center}
.vu i{display:block;width:14px;height:9px;background:#222;border-radius:1px}
.vu i.on.g{background:#2fe06a;box-shadow:0 0 6px #2fe06a}.vu i.on.o{background:#ff9d00;box-shadow:0 0 6px #ff9d00}.vu i.on.r{background:#ff3b30;box-shadow:0 0 6px #ff3b30}
/* selettore stile (solo mockup) */
#sw{position:fixed;right:10px;bottom:10px;z-index:9;display:flex;gap:6px;background:#000c;padding:6px;border-radius:10px}
#sw button{background:#333;color:#fff;border:0;padding:8px 12px;border-radius:6px;font:14px system-ui;cursor:pointer}#sw button.on{background:#0a84ff}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="desk" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></symbol>
<symbol id="folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="shot" viewBox="0 0 24 24"><path d="M6 3v13a2 2 0 0 0 2 2h13M3 6h13a2 2 0 0 1 2 2v13"/></symbol>
<symbol id="task" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
<symbol id="calc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M8 16h2M12 16h2M16 12v4"/></symbol>
<symbol id="video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></symbol>
<symbol id="mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
<symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
<symbol id="prev" viewBox="0 0 24 24"><path d="M6 5v14M19 5l-9 7 9 7z"/></symbol>
<symbol id="next" viewBox="0 0 24 24"><path d="M18 5v14M5 5l9 7-9 7z"/></symbol>
<symbol id="pp" viewBox="0 0 24 24"><path d="M7 5v14M17 5v14"/></symbol>
<symbol id="mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"/></symbol>
<symbol id="note" viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></symbol>
</defs></svg>
<div id="stage" class="t-windows">
 <section class="card" id="c1"><div id="clock">14:32<small>07</small></div><div id="date">giovedì 26 novembre</div>
  <div class="stat">CPU<span class="bar"><i style="width:32%"></i></span>32%</div><div class="stat">RAM<span class="bar"><i style="width:61%"></i></span>61%</div></section>
 <section class="card" id="c2"><div id="now"><div id="art"><svg class="i" style="color:#000;width:44px;height:44px"><use href="#note"/></svg></div><div><div id="song">Instant Crush</div><div id="artist">Daft Punk</div></div></div>
  <div id="tr"><button class="tb"><svg class="i"><use href="#prev"/></svg></button><button class="tb big"><svg class="i"><use href="#pp"/></svg></button><button class="tb"><svg class="i"><use href="#next"/></svg></button><button class="tb"><svg class="i"><use href="#mute"/></svg></button></div></section>
 <section class="card" id="vol"><div id="master"></div><div id="apps"></div></section>
 <section id="deck"></section>
</div>
<div id="sw"></div>
<script>
var THEMES={windows:'slider',apple:'knob',neon:'knob',dj:'fader'};
var vals={master:42,spotify:70,chrome:35,discord:55};
var apps=[['master','Volume PC'],['spotify','Spotify'],['chrome','Chrome'],['discord','Discord']];
var keys=[['desk','Desktop','sys'],['folder','File','sys'],['shot','Screenshot','work'],['task','Task','sys'],['calc','Calcolatrice','work'],['video','YouTube','audio'],['mail','Gmail','work'],['lock','Blocca PC','danger']];
var theme='windows';
function ctl(id,size){ // size: lg | sm
 var kind=THEMES[theme],box=document.createElement('div');box.style.width='100%';box.style.textAlign='center';
 var label=document.createElement('div');label.className='lbl';label.style.justifyContent='center';
 var name=apps.filter(function(a){return a[0]==id})[0][1];
 function setLabel(){label.innerHTML='<span class="'+(size=='lg'?'big-title':'')+'">'+name+'</span><b>'+Math.round(vals[id])+'%</b>';}

 if(kind=='fader'){
  var H=size=='lg'?150:118,fd=document.createElement('div');fd.className='fd '+size;fd.innerHTML='<div class="scale"></div><div class="slot"></div><div class="cap"></div>';
  var cap=fd.querySelector('.cap'),vu=null,CH=size=='lg'?28:22;
  function drawF(){cap.style.top=(8+(100-vals[id])/100*(H-16)-CH/2)+'px';setLabel();if(vu){var n=Math.round(vals[id]/100*12);for(var i=0;i<12;i++){vu.children[i].className=(i<n?'on ':'')+(i<7?'g':i<10?'o':'r')}}}
  function mvF(e){var r=fd.getBoundingClientRect();vals[id]=Math.max(0,Math.min(100,100-(e.clientY-r.top-8*r.height/H)/(r.height*(H-16)/H)*100));drawF();}
  fd.addEventListener('pointerdown',function(e){fd.setPointerCapture(e.pointerId);mvF(e);fd.onpointermove=mvF});
  fd.addEventListener('pointerup',function(){fd.onpointermove=null});
  var row=document.createElement('div');row.style.cssText='display:flex;gap:14px;justify-content:center;align-items:center';row.appendChild(fd);
  if(size=='lg'){vu=document.createElement('div');vu.className='vu';for(var q=0;q<12;q++){vu.appendChild(document.createElement('i'))}row.appendChild(vu)}
  box.appendChild(row);box.appendChild(label);drawF();return box;
 }
 if(kind=='slider'){
  var s=document.createElement('div');s.className='sl '+size;s.innerHTML='<div class="tk"></div><div class="fl"></div><div class="th"></div>';
  var fl=s.querySelector('.fl'),th=s.querySelector('.th');
  function draw(){fl.style.width=vals[id]+'%';th.style.left=vals[id]+'%';setLabel();}
  function mv(e){var r=s.getBoundingClientRect(),k=1024/window.innerWidth*0+stageScale();vals[id]=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));draw();}
  s.addEventListener('pointerdown',function(e){s.setPointerCapture(e.pointerId);mv(e);s.onpointermove=mv;});
  s.addEventListener('pointerup',function(){s.onpointermove=null});
  box.appendChild(s);box.appendChild(label);draw();
 }else{
  var D=size=="lg"?176:96,R=D/2-(size=='lg'?14:9),sw=size=='lg'?12:8,c=D/2;
  var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 '+D+' '+D);svg.setAttribute('width',D);svg.setAttribute('height',D);svg.setAttribute('class','kn');
  function pt(a,r){a=a*Math.PI/180;return [c+r*Math.cos(a),c+r*Math.sin(a)]}
  function arc(v,r){var a0=135,a1=135+270*v,p0=pt(a0,r),p1=pt(a1,r);return 'M'+p0+' A'+r+' '+r+' 0 '+((a1-a0)>180?1:0)+' 1 '+p1}
  function arc2(r){var p0=pt(200,r-3),p1=pt(290,r-3);return 'M'+p0+' A'+(r-3)+' '+(r-3)+' 0 0 1 '+p1}
  function draw(){var v=vals[id]/100,body=theme=='apple'?'rgba(255,255,255,.16)':'#0d0d2b';var ind=pt(135+270*v,R-sw-4),ind2=pt(135+270*v,R-sw-(size=='lg'?30:16));
   svg.innerHTML='<path d="'+arc(1,R)+'" fill="none" stroke="'+(theme=='apple'?'rgba(255,255,255,.22)':'#1a1a44')+'" stroke-width="'+sw+'" stroke-linecap="round"/>'+
   '<path d="'+arc(Math.max(v,.002),R)+'" fill="none" stroke="var(--accent)" stroke-width="'+sw+'" stroke-linecap="round"'+(theme=='neon'?' style="filter:drop-shadow(0 0 6px var(--accent))"':'')+'/>'+
   '<circle cx="'+c+'" cy="'+c+'" r="'+(R-sw-4)+'" fill="'+body+'" '+(theme=='neon'?'stroke="var(--accent)" stroke-opacity=".5"':theme=='apple'?'stroke="rgba(255,255,255,.6)" stroke-width="1.5"':'')+'/>'+(theme=='apple'?'<path d="'+arc2(R-sw-4)+'" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="2" stroke-linecap="round"/>':'')+
   '<line x1="'+ind2[0]+'" y1="'+ind2[1]+'" x2="'+ind[0]+'" y2="'+ind[1]+'" stroke="'+(theme=='apple'?'#fff':'var(--accent)')+'" stroke-width="'+(size=='lg'?5:3)+'" stroke-linecap="round"/>'+
   (size=='lg'?'<text x="'+c+'" y="'+(c+10)+'" font-size="30">'+Math.round(vals[id])+'</text>':'');setLabel();}
  var y0,v0;svg.addEventListener('pointerdown',function(e){svg.setPointerCapture(e.pointerId);y0=e.clientY;v0=vals[id];svg.onpointermove=function(e){vals[id]=Math.max(0,Math.min(100,v0+(y0-e.clientY)/stageScale()/1.6));draw();}});
  svg.addEventListener('pointerup',function(){svg.onpointermove=null});
  box.appendChild(svg);box.appendChild(label);draw();
 }
 return box;
}
function build(){
 document.getElementById('stage').className='t-'+theme;
 var m=document.getElementById('master'),a=document.getElementById('apps');m.innerHTML='';a.innerHTML='';
 m.appendChild(ctl('master','lg'));
 ['spotify','chrome','discord'].forEach(function(id){var d=document.createElement('div');d.className='app';d.appendChild(ctl(id,'sm'));a.appendChild(d)});
 var old=document.querySelector('.wave');if(old)old.remove();if(theme=='dj'){var w=document.createElementNS('http://www.w3.org/2000/svg','svg');w.setAttribute('class','wave');w.setAttribute('viewBox','0 0 500 70');w.setAttribute('preserveAspectRatio','none');var h='';for(var x=0;x<500;x+=4){var a=8+Math.abs(Math.sin(x/17)*Math.sin(x/53))*26;h+='<rect x="'+x+'" y="'+(35-a)+'" width="2" height="'+(a*2)+'" fill="'+(x<220?'#2f9bff':'#1c4f8a')+'"/>'}w.innerHTML=h;document.getElementById('c2').appendChild(w)}
 var dk=document.getElementById('deck');dk.innerHTML='';
 keys.forEach(function(k){var b=document.createElement('button');b.className='key';b.setAttribute('data-c',k[2]);b.innerHTML='<svg class="i"><use href="#'+k[0]+'"/></svg><span>'+k[1]+'</span>';dk.appendChild(b)});
 var sw=document.getElementById('sw');sw.innerHTML='';
 for(var t in THEMES){(function(t){var b=document.createElement('button');b.textContent=(t=='apple'?'Apple Glass':t[0].toUpperCase()+t.slice(1))+({knob:' (knob)',slider:' (slider)',fader:' (fader)'}[THEMES[t]]);if(t==theme)b.className='on';b.onclick=function(){theme=t;build()};sw.appendChild(b)})(t)}
}
function stageScale(){return Math.min(window.innerWidth/1024,window.innerHeight/768)}
function fit(){var s=stageScale();document.getElementById('stage').style.transform='scale('+s+')'}
window.onresize=fit;fit();build();
</script></body></html>
